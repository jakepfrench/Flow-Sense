<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Sense</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            text-align: center;
        }

        .container {
            margin-top: 60px;
        }

        .logo {
            width: 240px;
            height: 240px;
            display: block;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 42px;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        p {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            src="images/icon_240x240.png"
            alt="Flow Sense"
            class="logo"
        >

        <h1>Flow Sense</h1>

        <p>Coming 2027</p>

    </main>

</body>
</html>
